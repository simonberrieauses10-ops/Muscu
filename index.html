<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Carnet Muscu</title>
<style>
:root{--bg:#121212;--card:#1c1c1c;--card2:#262626;--line:#333;--txt:#f2f2f2;--muted:#9a9a9a;--or:#f28c28;--or2:#ffb366;--or3:#6e3a0d;--or4:#2a1b0e;--ok:#4caf7a;--bad:#e05a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:80px}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:rgba(18,18,18,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid #232323}
header h1{margin:0 auto;font-size:20px;max-width:680px}
main{max-width:680px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#171717;border-top:1px solid #2a2a2a;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 9px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--or)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #242424}
.card.accent{border-color:var(--or3);background:linear-gradient(160deg,#2a1b0e,#1c1c1c 60%)}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0 0 4px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{display:block;width:100%;background:var(--or);color:#1a1a1a;border:0;border-radius:10px;padding:12px;font-weight:600;font-size:15px;margin-top:10px;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--or2);border:1px solid var(--or3)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin:0}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #5a2a26}
.btn.link{background:none;border:0;color:var(--muted);padding:4px 6px;width:auto;display:inline-block;margin:0;font-weight:500;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=checkbox]{width:20px;height:20px;padding:0;border-radius:5px;flex:none;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--or)}
input:focus,select:focus{outline:none;border-color:var(--or)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--card2);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--or2)}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:8px;background:#2c2c2c;border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar>i{display:block;height:100%;background:var(--or);border-radius:5px}
.bar.over>i{background:var(--bad)}
.macro{display:flex;justify-content:space-between;font-size:13px}
.badge{display:inline-block;background:var(--or3);color:var(--or2);font-size:11px;padding:2px 8px;border-radius:20px;vertical-align:middle}
.badge.grey{background:#2e2e2e;color:#bbb}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a;gap:10px}
.item:last-child{border-bottom:0}
.exlist{margin:6px 0 0;padding:0;list-style:none}
.exlist li{font-size:13px;color:#ccc;padding:2px 0}
.exlist li b{color:var(--or2);font-weight:600;display:inline-block;min-width:62px}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 50px;gap:6px;align-items:center;margin-top:6px}
.setrow .n{color:var(--muted);font-size:13px;text-align:center}
.setrow input{text-align:center;padding:10px 4px}
.sethead{display:grid;grid-template-columns:24px 1fr 1fr 50px;gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:#777;font-size:18px;font-family:inherit;cursor:pointer}
.setrow.done input{border-color:var(--or3);background:var(--or4)}
.setrow.done .chk{background:var(--or);color:#1a1a1a;border-color:var(--or)}
.hint{font-size:12.5px;color:#cfa37a;background:#221a12;border-radius:8px;padding:7px 9px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);border:1px solid #2a2a2a;color:var(--muted);border-radius:10px;padding:9px 4px;font-size:13px;font-family:inherit}
.tabs button.on{background:var(--or4);color:var(--or2);border-color:var(--or3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{background:var(--card2);border:1px solid #333;color:#bbb;border-radius:20px;padding:6px 12px;font-size:13px;font-family:inherit}
.chips button.on{background:var(--or4);border-color:var(--or3);color:var(--or2)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:656px;margin:0 auto;background:#24170b;border:1px solid var(--or);border-radius:14px;padding:10px 12px;z-index:7;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#timer .big{font-size:26px;font-weight:700;color:var(--or2);font-variant-numeric:tabular-nums}
#timer.ring{animation:pulse .5s infinite alternate}
@keyframes pulse{from{background:#24170b}to{background:#5a300c}}
.hidden{display:none!important}
body.ton main{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:#1a1a1a;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid #333}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 60px);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;border:1px solid var(--or3);transition:opacity .3s;max-width:90vw;text-align:center}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:#888;font-size:11px;font-family:inherit}
details{border-bottom:1px solid #2a2a2a}
details:last-child{border-bottom:0}
summary{list-style:none;padding:11px 0;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary .arrow{color:var(--muted);transition:transform .2s}
details[open] summary .arrow{transform:rotate(90deg)}
.slot{display:grid;grid-template-columns:1fr 86px;gap:6px;margin-bottom:6px}
.slotlbl{font-size:11.5px;color:var(--muted);margin-top:6px}
.shop{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #262626}
.shop.ok span{color:#666;text-decoration:line-through}
.cat{font-size:12px;color:var(--or2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.steps{padding-left:18px;margin:6px 0}.steps li{margin:4px 0;font-size:14px}
.ing{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed #2c2c2c}
.right{text-align:right}
.nowrap{white-space:nowrap}
.mt{margin-top:10px}

/* v2 */
.bar{height:9px}
.bar>i{background:linear-gradient(90deg,#ffa94d,#f28c28 60%,#e8590c)}
.pc{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:#262626;color:#ccc;vertical-align:middle}
.pc.k{background:#3a220c;color:#ffc078}
.pc.p{background:#2e1a08;color:#ffd8a8;border:1px solid #5a3510}
.hero{background:radial-gradient(130% 160% at 100% 0%,#6b330a 0%,#2a1708 35%,#1c1c1c 70%);border-color:#4a2a10}
.livebar{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:4;display:flex;gap:8px;background:rgba(18,18,18,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:8px 0;margin:-4px 0 6px}
.livebar .stat{background:#1f1f1f;border:1px solid #2c2c2c}
.livebar .stat.hot{background:linear-gradient(160deg,#5a2d08,#2a1708);border-color:#a84300}
.livebar .stat.hot b{color:#ffc078}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.dpill{flex:1 0 44px;background:var(--card);border:1px solid #2a2a2a;border-radius:14px;padding:8px 0 7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit;font-size:11px;cursor:pointer}
.dpill b{font-size:18px;color:var(--txt)}
.dpill.today:not(.on){border-color:#a84300}
.dpill.on{background:linear-gradient(180deg,#ffa94d,#e8590c);border-color:#ffa94d;color:#3a1a04}
.dpill.on b{color:#1a0b02}
.mini{width:24px;height:4px;background:#333;border-radius:3px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--or)}
.dpill.on .mini{background:rgba(0,0,0,.25)}.dpill.on .mini i{background:#1a0b02}
.meal{--mc:#f28c28;--mb:rgba(242,140,40,.14);position:relative;background:var(--card);border:1px solid #262626;border-radius:16px;padding:12px 12px 10px 17px;margin-bottom:10px;overflow:hidden}
.meal::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc)}
.meal.s-pdj{--mc:#ffc078;--mb:rgba(255,192,120,.13)}
.meal.s-dej{--mc:#f28c28;--mb:rgba(242,140,40,.14)}
.meal.s-col{--mc:#ffa94d;--mb:rgba(255,169,77,.13)}
.meal.s-din{--mc:#e8590c;--mb:rgba(232,89,12,.16)}
.mhead{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mc);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.micon{width:28px;height:28px;border-radius:9px;background:var(--mb);display:inline-flex;align-items:center;justify-content:center;flex:none}
.micon svg,.icobtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mname{font-size:16.5px;font-weight:650;margin:9px 0 8px;cursor:pointer;line-height:1.3}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.mfoot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid #262626}
.icobtn{background:#222;border:1px solid #2e2e2e;color:#c9c9c9;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;font-size:10.5px;cursor:pointer}
.icobtn:active{background:var(--or4);color:var(--or2)}
.icobtn.sq{width:44px;height:44px;padding:0;justify-content:center;flex:none}
.stepper{display:flex;align-items:center;background:#242424;border:1px solid #333;border-radius:20px;text-transform:none;letter-spacing:0;font-weight:500}
.stepper button{width:30px;height:28px;border:0;background:transparent;color:var(--or2);font-size:17px;font-family:inherit;cursor:pointer}
.stepper span{font-size:12px;color:var(--txt);min-width:70px;text-align:center}
.meal.empty{border-style:dashed;cursor:pointer}
.meal.empty::before{opacity:.35}
.mempty{color:var(--muted);padding:12px 0 4px;text-align:center;font-size:14px}
.shopcat{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--or2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:16px 0 6px}
.shopcat span{background:#3a220c;color:#ffc078;border-radius:20px;padding:1px 8px;font-size:11px}
.shopbox{background:#202020;border:1px solid #2a2a2a;border-radius:12px;padding:2px 12px}
.shop{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #2a2a2a;margin:0;font-size:15px;color:var(--txt);cursor:pointer}
.shop:last-child{border-bottom:0}
.shop .qty{color:#ffc078;font-size:13.5px;font-variant-numeric:tabular-nums}
.shop.ok span{color:#666;text-decoration:line-through}
.shop.ok .qty{color:#555}
.brow{display:grid;grid-template-columns:1fr 84px 44px;gap:6px;margin-bottom:6px}
.brow input{text-align:center}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:4px}
.split i{display:block;height:100%}
.badge{margin-left:4px}

/* v3 */
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:0;background:rgba(18,18,18,.92)}
.hrow{display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto}
header h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
#hact{gap:10px}
.hbtn{width:42px;height:42px;border-radius:50%;background:#262626;border:1px solid #333;color:#eee;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hsub{color:#9aa7ff;font-size:13.5px;margin:0 4px 14px}
.habit{background:linear-gradient(165deg,rgba(var(--hr),.32) 0%,rgba(var(--hr),.12) 55%,rgba(var(--hr),.07) 100%);border:1px solid rgba(var(--hr),.5);border-radius:24px;padding:16px 16px 18px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.25)}
.hhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hico{width:48px;height:48px;border-radius:15px;background:rgba(0,0,0,.35);border:1px solid rgba(var(--hr),.35);display:flex;align-items:center;justify-content:center;color:var(--hc);flex:none;cursor:pointer}
.hico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hname{font-size:17px;font-weight:650;cursor:pointer}
.hname small{display:block;font-size:11px;color:rgba(255,255,255,.5);font-weight:500;margin-top:1px}
.hchk{width:46px;height:46px;border-radius:14px;border:1px solid rgba(var(--hr),.85);background:rgba(var(--hr),.35);color:#0e1a14;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.hchk.on{background:var(--hc);box-shadow:0 0 14px rgba(var(--hr),.55)}
.hchk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hcells{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.hcells b{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.45);display:flex;align-items:center}
.hcells i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.07)}
.hcells i[data-act]{cursor:pointer}
.hcells i.on{background:var(--hc);box-shadow:0 0 5px rgba(var(--hr),.45)}
.hcells i.fut{background:transparent}
.hcells i.today{outline:1.5px solid rgba(255,255,255,.65)}
.swatch{width:34px;height:34px;border-radius:50%!important;padding:0!important;border:2px solid transparent!important}
.swatch.on{border-color:#fff!important}
.icopick{width:42px;height:42px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border-radius:12px!important}
.icopick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{position:relative;background:linear-gradient(160deg,#272727,#1b1b1b);border:1px solid #2e2e2e;border-radius:24px;padding:16px;min-height:158px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile.wide{grid-column:span 2;min-height:0}
.tile.next{border-color:#6e3a0d;background:linear-gradient(160deg,#2e1d0e,#1b1b1b 70%)}
.tile h4{margin:0;font-size:16px;font-weight:650}
.sub{color:#8d8d8d;font-size:12.5px;margin-top:2px}
.tset{position:absolute;top:16px;right:16px;color:#6f6f6f}
.tset.static{position:static}
.tset svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.ring{width:58px;height:58px;flex:none}
.bignum{font-size:42px;font-weight:700;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.bignum.md{font-size:30px;letter-spacing:-.5px}
.bignum .unit{font-size:17px;color:#9a9a9a;font-weight:500;letter-spacing:0;margin-left:5px}
.split2{flex-direction:row;align-items:center;justify-content:space-between;padding:16px 18px}
.vsep{width:1px;align-self:stretch;background:#333;margin:0 6px}
.tile.plus{align-items:center;justify-content:center;border-style:dashed;background:#191919}
.tile.plus .pl{font-size:56px;font-weight:200;color:#555;line-height:1}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cal .ml{font-size:11.5px;color:#bdbdbd;text-align:center;margin-bottom:9px;text-transform:capitalize}
.cald{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;justify-items:center;align-items:center}
.cald i{width:4px;height:4px;border-radius:50%;background:#4c4c4c}
.cald i.fut{background:#2b2b2b}
.cald i.on{width:7px;height:7px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.55)}
.cald i.today{background:#f28c28}
.cald i.today.on{background:#ffb366}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 12px}

/* v4 calendrier mensuel */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:15px;text-transform:capitalize}
.calnav{width:34px;height:34px;border-radius:50%;background:#262626;border:1px solid #333;color:#ddd;font-size:18px;cursor:pointer}
.calnav:disabled{opacity:.25}
.calm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calm .wd{font-size:11px;color:#777;font-weight:600;padding-bottom:2px}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13.5px;color:#9a9a9a;font-variant-numeric:tabular-nums}
.cd.fut{color:#444}
.cd.on{background:linear-gradient(160deg,#ffa94d,#e8590c);color:#1a0b02;font-weight:700;box-shadow:0 0 10px rgba(242,140,40,.35);cursor:pointer}
.cd.today{outline:1.5px solid #f2f2f2;outline-offset:-1px;color:#fff}
.cd.today.on{color:#1a0b02}
</style>
</head>
<body>
<header><div class="hrow"><h1 id="title">Habitudes</h1><div id="hact" class="row"></div></div></header>
<main id="view"></main>

<div id="timer" class="hidden">
  <div class="row between">
    <div><div class="muted small">Repos</div><div class="big" id="tLeft">0:00</div></div>
    <div class="row">
      <button class="btn sm ghost" data-act="timerAdd" data-s="-15">-15 s</button>
      <button class="btn sm ghost" data-act="timerAdd" data-s="15">+15 s</button>
      <button class="btn sm" data-act="timerStop">OK</button>
    </div>
  </div>
  <div class="bar" style="margin:8px 0 0"><i id="tBar" style="width:100%"></i></div>
</div>

/* ---------- Calculs nutrition ---------- */
function targets(){
  const p = S.profile;
  const bmr = 10*num(p.poids) + 6.25*num(p.taille) - 5*num(p.age) + (p.sexe === 'H' ? 5 : -161);
  const tdee = bmr * num(p.activite);
  const adj = {seche:-0.20, maintien:0, masse:0.10}[p.phase] ?? 0;
  const kcal = Math.round(tdee * (1 + adj) / 10) * 10;
  const prot = r0(({seche:2.2, maintien:1.8, masse:2.0}[p.phase] ?? 2) * num(p.poids));
  const lip = r0(({seche:0.8, maintien:0.9, masse:1.0}[p.phase] ?? 0.9) * num(p.poids));
  const glu = Math.max(0, r0((kcal - prot*4 - lip*9) / 4));
  return {bmr:r0(bmr), tdee:r0(tdee), kcal, p:prot, l:lip, g:glu};
}
function recMacros(r, f = 1){
  const m = {k:0, p:0, g:0, l:0};
  r.ing.forEach(([id, g]) => { const i = getIng(id); const q = g * f / 100; m.k += i.k*q; m.p += i.p*q; m.g += i.g*q; m.l += i.l*q; });
  return {k:r0(m.k), p:r0(m.p), g:r0(m.g), l:r0(m.l)};
}

function slots(){
  const n = num(S.profile.repas), pdj = S.profile.pdj !== false;
  if(n <= 3) return pdj ? ['pdj','dej','din'] : ['dej','col','din'];
  if(n === 4) return pdj ? ['pdj','dej','col','din'] : ['dej','col','din','col'];
  return pdj ? ['pdj','col','dej','col','din'] : ['dej','col','din','col','col'];
}
const slotType = s => s === 'pdj' ? 'pdj' : s === 'col' ? 'col' : 'plat';
function slotShares(){ const sl = slots(); const tot = sl.reduce((a, s) => a + SLOT_SHARE[s], 0); return sl.map(s => SLOT_SHARE[s] / tot); }

   kcal = MET x 3,5 x poids (kg) / 200 x durée (min) */
const kcalSeance = (met, min, kg) => r0(met * 3.5 * kg / 200 * min);

const sortedSessions = () => [...S.sessions].sort((a, b) => b.start - a.start);
function lastPerf(exId){
  for(const s of sortedSessions()){ const x = s.exercises.find(e => e.exId === exId && e.sets.length); if(x) return {date:s.date, sets:x.sets}; }
  return null;
}
function parseReps(str){
  const unit = /s$/.test(str) ? 's' : '';
  const parts = String(str).replace('s','').split('-').map(Number);
  return {rmin:parts[0], rmax:parts[1] || parts[0], unit};
}
function suggest(exId, tgt){
  const ex = getEx(exId), last = lastPerf(exId), u = ex.u === 's' ? ' s' : '';
  if(!last) return {kg:'', hint:'Première fois : prends une charge qui te laisse 1 à 2 répétitions en réserve sur chaque série.'};
  const lastTxt = 'Dernière fois (' + fmtDate(last.date) + ') : ' + last.sets.map(s => (s.kg ? fr(s.kg) + ' kg x ' : '') + s.reps + u).join(', ');
  const top = Math.max(...last.sets.map(s => num(s.kg)));
  const atTop = last.sets.filter(s => num(s.kg) === top);
  const reached = atTop.length >= tgt.sets && atTop.every(s => num(s.reps) >= tgt.rmax);
  if(ex.u === 's') return {kg: top || '', hint: lastTxt + '. ' + (reached ? 'Objectif atteint : ajoute 10 s par série.' : 'Vise ' + tgt.rmax + ' s sur chaque série.')};
  if(reached){
    if(top === 0) return {kg:'', hint: lastTxt + '. Objectif atteint : ajoute 2,5 kg de lest ou ralentis la descente.'};
    const inc = ex.t === 'poly' ? 2.5 : 1;
    return {kg: top + inc, hint: lastTxt + '. Haut de fourchette atteint sur toutes les séries : passe à ' + fr(top + inc) + ' kg.'};
  }
  return {kg: top || '', hint: lastTxt + '. Garde ' + (top ? fr(top) + ' kg' : 'la même charge') + ' et vise ' + tgt.rmax + ' répétitions sur chaque série.'};
}

function lineChart(pts, unit){
  if(pts.length < 2) return '<p class="muted">La courbe s\'affichera à partir de 2 points.</p>';
  const W = 600, H = 220, pl = 44, pr = 14, pt = 14, pb = 28;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if(mn === mx){ mn -= 1; mx += 1; }
  const py = (mx - mn) * 0.12; mn -= py; mx += py;
  const X = i => pl + (W - pl - pr) * i / (pts.length - 1);
  const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for(let k = 0; k <= 4; k++){ const v = mn + (mx - mn) * k / 4; const y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#2c2c2c"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${fr(r1(v))}</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const idx = [...new Set([0, Math.floor((pts.length - 1) / 2), pts.length - 1])];
  const xl = idx.map(i => `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(parseKey(pts[i].x).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}))}</text>`).join('');
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="#f28c28"><title>${fr(r1(p.y))} ${unit}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path d="${d}" fill="none" stroke="#f28c28" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

function suggestions(n = 6){
  const t = targets(), j = journal(), c = sumJ(j);
  const left = Math.max(1, num(S.profile.repas) - j.length);
  let perK = (t.kcal - c.k) / left, perP = Math.max(0, (t.p - c.p) / left);
  if(perK < 150) perK = 150;
  return allRecs().filter(r => allowed(r) && !r.occ).map(r => {
    const base = recMacros(r); const f = clampPortion(perK / Math.max(base.k, 1)); const m = recMacros(r, f);
    const score = Math.abs(m.k - perK) / perK + Math.abs(m.p - perP) / Math.max(perP, 20);
    return {r, f, m, score};
  }).sort((a, b) => a.score - b.score).slice(0, n);
}

function planDay(d){ if(!S.plan) return null; const i = diffDays(S.plan.start, d); return (i >= 0 && i < 7) ? S.plan.days[i] : null; }
const shareOf = slot => SLOT_SHARE[slot] / slots().reduce((a, s) => a + SLOT_SHARE[s], 0);
const autoPortion = (r, slot) => clampPortion(targets().kcal * shareOf(slot) / Math.max(recMacros(r).k, 1));
const planPool = type => allRecs().filter(r => r.type === type && allowed(r) && !r.occ);
const shuffle = a => { const b = [...a]; for(let i = b.length - 1; i > 0; i--){ const k = Math.floor(Math.random() * (i + 1)); [b[i], b[k]] = [b[k], b[i]]; } return b; };
function generatePlan(){
  const sl = slots(), batch = num(S.profile.batch);
  let plats = shuffle(planPool('plat'));
  if(batch > 0){ const bc = plats.filter(r => r.bc); plats = (bc.length >= batch ? bc : plats).slice(0, batch); }
  const pools = {plat:plats, pdj:shuffle(planPool('pdj')), col:shuffle(planPool('col'))}, cnt = {plat:0, pdj:0, col:0};
  const pick = type => { const arr = pools[type]; return arr.length ? arr[(cnt[type]++) % arr.length] : null; };
  const days = [];
  for(let d = 0; d < 7; d++) days.push(sl.map(s => { const r = pick(slotType(s)); return r ? {slot:s, rid:r.id, f:autoPortion(r, s)} : {slot:s, rid:'', f:1}; }));
  S.plan = {start:mondayOf(today()), days}; S.shopChecked = {}; UI.pday = null; save();
}
function curPlanDay(){ if(UI.pday == null){ const i = diffDays(S.plan.start, today()); UI.pday = (i >= 0 && i < 7) ? i : 0; } return UI.pday; }
function dayTot(day){ return day.reduce((a, m) => { const r = recById(m.rid); if(!r) return a; const x = recMacros(r, num(m.f)); return {k:a.k + x.k, p:a.p + x.p}; }, {k:0, p:0}); }
function shoppingList(){
  const tot = {};
  S.plan.days.forEach(day => day.forEach(m => { const r = recById(m.rid); if(!r) return; r.ing.forEach(([i, g]) => { tot[i] = (tot[i] || 0) + g * num(m.f); }); }));
  const groups = {};
  Object.entries(tot).forEach(([i, g]) => { const c = getIng(i).c; (groups[c] = groups[c] || []).push([i, g]); });
  const cats = [...CAT_ORDER, ...Object.keys(groups).filter(c => !CAT_ORDER.includes(c))];
  return cats.filter(c => groups[c]).map(c => [c, groups[c].sort((a, b) => getIng(a[0]).n.localeCompare(getIng(b[0]).n))]);
}
function mealCard(m, d, k){
  const r = recById(m.rid), cls = 'meal s-' + m.slot, dk = `data-d="${d}" data-k="${k}"`;
  const head = right => `<div class="mhead"><span class="micon">${ICO[m.slot]}</span><span class="grow">${SLOT_LBL[m.slot]}</span>${right || ''}</div>`;
  if(!r) return `<div class="${cls} empty" data-act="planPick" ${dk}>${head()}<div class="mempty">+ Choisir un repas</div></div>`;
  const x = recMacros(r, num(m.f));
  return `<div class="${cls}">${head(`<div class="stepper"><button data-act="planF" ${dk} data-s="-1" aria-label="Moins">&#8722;</button><span>${fmtPortion(m.f)}</span><button data-act="planF" ${dk} data-s="1" aria-label="Plus">+</button></div>`)}
    <div class="mname" data-act="recModal" data-id="${r.id}" data-f="${m.f}">${esc(r.n)}</div>
    <div class="pchips"><span class="pc k">${x.k} kcal</span><span class="pc p">${x.p} g protéines</span><span class="pc">G ${x.g} g</span><span class="pc">L ${x.l} g</span></div>
    <div class="mfoot"><button class="icobtn" data-act="planShuffle" ${dk}>${ICO.refresh}<span>Autre idée</span></button><button class="icobtn" data-act="planPick" ${dk}>${ICO.edit}<span>Choisir</span></button><button class="icobtn" data-act="planMove" ${dk}>${ICO.move}<span>Déplacer</span></button><button class="icobtn" data-act="planDel" ${dk}>${ICO.trash}<span>Retirer</span></button></div></div>`;
}

  list.forEach(([c, items]) => {
    h += `<div class="shopcat">${esc(c)}<span>${items.length}</span></div><div class="shopbox">` + items.map(([i, g]) => { const ok = S.shopChecked[i]; return `<label class="shop ${ok ? 'ok' : ''}"><input type="checkbox" data-shop="${i}" ${ok ? 'checked' : ''}><span class="grow">${esc(getIng(i).n)}</span><span class="qty">${fmtQty(i, g, true)}</span></label>`; }).join('') + '</div>';
  });
  h += `<p class="muted small mt">Non inclus : sel, poivre, épices, ail, moutarde, sauce soja.</p></div>`;

  exportCsv: async () => { if(await exportFile('carnet-muscu-progression-' + today() + '.csv', 'text/csv;charset=utf-8', csvData())) markExported(); },
  monthlyModal: () => modal(monthlyHtml()),
  monthlyLater: () => { UI.monthlySnooze = true; closeModal(); render(); },
  habCheck: el => {
    const h = S.habits.find(x => x.id === el.dataset.id);
    if(h.auto){ toast(HAUTO[h.auto].info); return; }
    const d = today(), L = (S.habitLog[h.id] = S.habitLog[h.id] || {});
    if(L[d]) delete L[d]; else L[d] = true; save(); render();
  },
  habCell: el => { const L = (S.habitLog[el.dataset.id] = S.habitLog[el.dataset.id] || {}), d = el.dataset.d; if(L[d]) delete L[d]; else L[d] = true; save(); render(); },
  habAdd: () => modal(habFormHtml(null)),
  habEdit: el => modal(habFormHtml(el.dataset.id)),
  hfCol: el => { UI.habForm.col = el.dataset.k; document.querySelectorAll('#hfCol button').forEach(b => b.classList.toggle('on', b === el)); },
  hfIco: el => { UI.habForm.ico = el.dataset.k; document.querySelectorAll('#hfIco button').forEach(b => b.classList.toggle('on', b === el)); },
  habSave: () => {
    const f = UI.habForm, n = $('#hfN').value.trim(); if(!n) return toast('Donne un nom à l\'habitude');
    if(f.id){ const h = S.habits.find(x => x.id === f.id); Object.assign(h, {n, ico:f.ico, col:f.col}); }
    else S.habits.push({id:'h_' + uid(), auto:null, n, ico:f.ico, col:f.col});
    save(); closeModal(); render();
  },
  habDel: el => { if(!confirm('Supprimer cette habitude et son historique ?')) return; S.habits = S.habits.filter(x => x.id !== el.dataset.id); delete S.habitLog[el.dataset.id]; save(); closeModal(); render(); },
  habAddAuto: el => { const k = el.dataset.k; S.habits.push({id:'h_' + k, auto:k, ...pick3(HAUTO[k])}); save(); closeModal(); render(); },
  seModal: el => modal(seModalHtml(el.dataset.id)),
  progModal: () => modal(progModalHtml()),
  weightModal: () => modal(weightModalHtml()),
  goPoids: () => { closeModal(); UI.tab = 'suivi'; UI.suivi = 'poids'; render(true); },
  calM: el => { UI.calM = Math.min(0, (UI.calM || 0) + num(el.dataset.n)); render(); },
  calDay: el => { const l = S.sessions.filter(x => x.date === el.dataset.d).map(x => x.nom + ' (' + x.duree + ' min, ' + x.kcal + ' kcal)'); toast(fmtDateLong(el.dataset.d) + ' : ' + l.join(', ')); },
  goSuiviHist: () => { UI.tab = 'suivi'; UI.suivi = 'hist'; render(true); },
  import: () => $('#importFile').click(),
  reset: () => { if(confirm('Effacer TOUTES les données (séances, pesées, journal, menus) ? Exporte une sauvegarde avant si besoin.') && confirm('Dernière confirmation : tout effacer ?')){ S = freshState(); save(); stopRest(); go('accueil'); } },
  timerAdd: el => { if(!T) return; T.end += num(el.dataset.s) * 1000; T.total = Math.max(T.total, Math.round((T.end - Date.now()) / 1000)); T.rang = false; $('#timer').classList.remove('ring'); tick(); },
  timerStop: () => stopRest(),
  setMet: el => { S.active.met = num(el.dataset.v); save(); render(); },
  pday: el => { UI.pday = +el.dataset.d; render(); },
  planPick: el => modal(planPickHtml(+el.dataset.d, +el.dataset.k)),
  planSet: el => { const m = S.plan.days[+el.dataset.d][+el.dataset.k], r = recById(el.dataset.id); m.rid = r.id; m.f = autoPortion(r, m.slot); save(); closeModal(); render(); },
  planShuffle: el => {
    const m = S.plan.days[+el.dataset.d][+el.dataset.k], pool = planPool(slotType(m.slot)).filter(r => r.id !== m.rid);
    if(!pool.length) return toast('Pas d\'autre recette disponible');
    const r = pool[Math.floor(Math.random() * pool.length)]; m.rid = r.id; m.f = autoPortion(r, m.slot); save(); render();
  },
  planF: el => { const m = S.plan.days[+el.dataset.d][+el.dataset.k]; let i = PORTIONS.indexOf(num(m.f)); if(i < 0) i = PORTIONS.indexOf(1); i = Math.min(PORTIONS.length - 1, Math.max(0, i + num(el.dataset.s))); m.f = PORTIONS[i]; save(); render(); },
  planDel: el => { const m = S.plan.days[+el.dataset.d][+el.dataset.k]; m.rid = ''; m.f = 1; save(); render(); },
  planMove: el => modal(planMoveHtml(+el.dataset.d, +el.dataset.k)),
  planMoveTo: el => {
    const A = S.plan.days[+el.dataset.d][+el.dataset.k], B = S.plan.days[+el.dataset.dd][+el.dataset.kk];
    [A.rid, B.rid] = [B.rid, A.rid]; [A.f, B.f] = [B.f, A.f];
    if(A.slot !== B.slot){ const ra = recById(A.rid), rb = recById(B.rid); if(ra) A.f = autoPortion(ra, A.slot); if(rb) B.f = autoPortion(rb, B.slot); }
    UI.pday = +el.dataset.dd; save(); closeModal(); render(); toast('Repas déplacé');
  },
  builder: el => { UI.builder = newBuilder(el.dataset.id || null); modal(builderHtml()); },
  bAdd: () => { builderSync(); UI.builder.rows.push({i:'poulet', g:''}); builderRefresh(); },
  bDel: el => { builderSync(); UI.builder.rows.splice(+el.dataset.i, 1); builderRefresh(); },
  bNewIng: () => {
    builderSync();
    const n = $('#niN').value.trim(), k = num($('#niK').value);
    if(!n) return toast('Donne un nom à l\'aliment');
    if(!k) return toast('Indique les calories pour 100 g');
    const id = 'i_' + uid(); S.customIng[id] = {n, c:$('#niC').value, k, p:num($('#niP').value), g:num($('#niG').value), l:num($('#niL').value)};
    UI.builder.rows.push({i:id, g:''}); save(); builderRefresh(); toast(n + ' ajouté à la liste des aliments');
  },
  bSave: () => {
    builderSync(); const B = UI.builder, rows = B.rows.filter(r => num(r.g) > 0);
    if(!B.n.trim()) return toast('Donne un nom au plat');
    if(!rows.length) return toast('Indique le poids d\'au moins un ingrédient');
    const P = Math.max(1, Math.round(num(B.portions)) || 1);
    const rec = {id:B.id || 'u_' + uid(), n:B.n.trim(), type:B.type, mine:1, bc:1, ph:['seche','maintien','masse'], t:0, portions:P, tot:rows.map(r => [r.i, num(r.g)]), ing:rows.map(r => [r.i, num(r.g) / P]), st:[]};
    const i = S.customRec.findIndex(x => x.id === rec.id); if(i >= 0) S.customRec[i] = rec; else S.customRec.push(rec);
    save(); closeModal(); render(); toast('Recette enregistrée');
  },
  bJournal: () => {
    builderSync(); const B = UI.builder, c = builderCalc();
    if(!c.tot.w) return toast('Indique le poids des ingrédients');
    addFood({nom:B.n.trim() || 'Plat maison', portion:1, k:c.per.k, p:c.per.p, g:c.per.g, l:c.per.l}); closeModal(); render(); toast('Ajouté au journal');
  },
  bDelRec: () => {
    const id = UI.builder.id; if(!confirm('Supprimer cette recette ?')) return;
    S.customRec = S.customRec.filter(r => r.id !== id);
    if(S.plan) S.plan.days.forEach(day => day.forEach(m => { if(m.rid === id){ m.rid = ''; m.f = 1; } }));
    save(); closeModal(); render(); toast('Recette supprimée');
  },
  closeModal: () => closeModal(),
};
function exPicker(swapIdx){
  const all = [...Object.entries(EX), ...Object.entries(S.customEx || {})];
  let h = `<div class="row between"><h2>${swapIdx === null ? 'Ajouter un exercice' : 'Remplacer l\'exercice'}</h2><button class="btn link" data-act="closeModal">Fermer</button></div>`;
  MUSCLES.forEach(m => { const list = all.filter(([, e]) => e.m === m); if(!list.length) return;
    h += `<div class="cat">${esc(m)}</div>` + list.map(([id, e]) => `<div class="item" data-act="pickEx" data-id="${id}" data-swap="${swapIdx === null ? '' : swapIdx}" style="cursor:pointer"><span>${esc(e.n)}</span><span class="muted small">${e.t === 'poly' ? 'polyarticulaire' : 'isolation'}</span></div>`).join(''); });
  h += `<div class="cat">Créer un exercice</div><input id="neN" placeholder="Nom de l'exercice"><div class="grid2"><select id="neM">${opts(MUSCLES.map(m => [m, m]), 'Autre')}</select><select id="neT">${opts([['poly','Polyarticulaire'],['iso','Isolation']], 'iso')}</select></div>
    <button class="btn" data-act="newEx" data-swap="${swapIdx === null ? '' : swapIdx}">Créer et ajouter</button>`;
  return h;
}
function updKcal(){ const el = $('#fKcal'); if(el) el.textContent = kcalSeance(num($('#fInt').value), num($('#fDur').value), num(S.profile.poids)); }

/* ---------- Minuteur de repos ---------- */
let T = null, AC = null;
function initAudio(){ try{ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){} }
function beep(){
  try{ if(AC){ [0, 0.25, 0.5].forEach(t => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; o.connect(g); g.connect(AC.destination); const t0 = AC.currentTime + t; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.start(t0); o.stop(t0 + 0.2); }); } if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
}
function startRest(sec){ T = {end:Date.now() + sec * 1000, total:sec, rang:false}; $('#timer').classList.remove('hidden', 'ring'); document.body.classList.add('ton'); tick(); }
function stopRest(){ T = null; document.body.classList.remove('ton'); $('#timer').classList.add('hidden'); $('#timer').classList.remove('ring'); }
function tick(){
  if(!T) return;
  const left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  $('#tLeft').textContent = left > 0 ? fmtClock(left) : 'C\'est reparti';
  $('#tBar').style.width = (T.total ? 100 * left / T.total : 0) + '%';
  if(left <= 0 && !T.rang){ T.rang = true; beep(); $('#timer').classList.add('ring'); const ref = T; setTimeout(() => { if(T === ref) stopRest(); }, 6000); }
}
setInterval(() => { tick(); const c = $('#chrono'); if(c && S.active){ c.textContent = fmtClock(Math.floor((Date.now() - S.active.start) / 1000)); const k = $('#liveK'); if(k) k.textContent = liveKcal(); } }, 500);

/* ---------- Écouteurs ---------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button'); if(nb){ go(nb.dataset.tab); return; }
  if(e.target.id === 'modal'){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.set){
    const [i, j, k] = el.dataset.set.split('.'); const x = S.active.exercises[+i]; const s = x.sets[+j]; const old = s[k];
    s[k] = el.value;
    if(k === 'kg'){ for(let n = +j + 1; n < x.sets.length; n++){ const t = x.sets[n]; if(!t.done && t.kg === old){ t.kg = el.value; const inp = document.querySelector(`[data-set="${i}.${n}.kg"]`); if(inp) inp.value = el.value; } } }
    save(); return;
  }
  if(el.id === 'fDur' || el.id === 'fInt') updKcal();
  if(UI.builder && (el.dataset.bg !== undefined || el.id === 'bP' || el.id === 'bN')){
    if(el.dataset.bg !== undefined) UI.builder.rows[+el.dataset.bg].g = el.value;
    if(el.id === 'bP') UI.builder.portions = el.value;
    if(el.id === 'bN') UI.builder.n = el.value;
    builderUpdTotals();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.bind){
    const [o, k] = el.dataset.bind.split('.');
    let v = el.value;
    if(el.type === 'number' || el.dataset.num !== undefined) v = num(v);
    if(el.dataset.bool !== undefined) v = v === 'true';
    if(k === 'activite') v = num(v);
    S[o][k] = v; save();
    if(el.dataset.rerender !== undefined) render();
    if(el.dataset.modal === 'prog') $('#modalBody').innerHTML = progModalHtml();
    return;
  }
  if(el.dataset.ui === 'progEx'){ UI.progEx = el.value; render(); return; }
  if(el.dataset.plan){ const [d, k, f] = el.dataset.plan.split('.'); const m = S.plan.days[+d][+k]; m[f] = f === 'f' ? num(el.value) : el.value; save(); render(); return; }
  if(el.dataset.shop){ S.shopChecked[el.dataset.shop] = el.checked; save(); render(); return; }
  if(el.dataset.excl){ const id = el.dataset.excl, ex = S.profile.exclusions; if(el.checked){ if(!ex.includes(id)) ex.push(id); } else S.profile.exclusions = ex.filter(x => x !== id); save(); const s = el.closest('details').querySelector('summary span'); if(s) s.textContent = 'Aliments exclus (' + S.profile.exclusions.length + ')'; return; }
  if(el.dataset.recf){ $('#modalBody').innerHTML = recModalHtml(el.dataset.recf, num(el.value)); return; }
  if(el.id === 'fInt') { updKcal(); return; }
  if(UI.builder && el.dataset.bi !== undefined){ UI.builder.rows[+el.dataset.bi].i = el.value; builderUpdTotals(); return; }
  if(UI.builder && el.id === 'bT'){ UI.builder.type = el.value; return; }
  if(el.id === 'importFile' && el.files[0]){
    const rd = new FileReader();
    rd.onload = () => { try{ const o = JSON.parse(rd.result); if(!o || !Array.isArray(o.sessions)) throw 0; if(!confirm('Remplacer les données actuelles par cette sauvegarde (' + o.sessions.length + ' séances) ?')) return; S = normalize(o); save(); go('accueil'); toast('Sauvegarde importée'); }catch(err){ toast('Fichier de sauvegarde invalide'); } };
    rd.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.day !== undefined) UI.openDays[d.dataset.day] = d.open; }, true);

/* ---------- Démarrage ---------- */
if(S.active) UI.tab = 'seance';
render(true);
if(monthlyDue()) modal(monthlyHtml());
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
